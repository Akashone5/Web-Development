<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill Up The Form</title>
</head>

<body>
    <h1> fill up the form</h1>
    <hr>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>
        </div>
        <br>
        <div>
            <label for="contact">contact</label>
            <input type="number" name="contact" id="contact" placeholder="Enter your number" required>
        </div> 
        <br>

        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" required>
        </div>
        <br>
        <div>
            <label for="Password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
         
        </div>
           <br>
        <div>
            <label for="gender">Gender: </label>
            <input type="radio" name="gender" id="male" value="male" required>Male
            <input type="radio" name="gender" id="female" value="female" required>Female
            <input type="radio" name="gender" id="Other" value="other" required>Other
            <input type="radio" name="gender" id="Ashwit / Dhruv" value="Ashwit / Dhruv" required>Ashwit / Dhruv
           
        </div>
         <br>
        <div>
            <label for="Term"> </label>
                <input type="checkbox" name="term" id="term" required> I agree to all the term and condition
         
        </div>
          <br>
        <hr>
        <div>
            <label for="submit"> </label>
            <input type="submit" name="submit" id="submit" value="submit"> 
        </div>

</body>

</html>
